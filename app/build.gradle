plugins {
    id 'com.android.application'
}
android {
    namespace 'com.tayson.launcher'
    compileSdk 33
    defaultConfig {
        applicationId 'com.tayson.launcher'
        minSdk 21
        targetSdk 25
        versionCode 3
        versionName '2.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
